<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .panel-title { font-size: 15px; font-weight: 600; fill: #1f2937; }
    .axis-label { font-size: 11px; fill: #6b7280; }
    .coord-label { font-size: 11px; fill: #374151; }
    .explanation { font-size: 12px; fill: #1f2937; }
    .axis-line { stroke: #9ca3af; stroke-width: 1; }
    .model-box { fill: #fb923c; fill-opacity: 0.4; stroke: #ea580c; stroke-width: 1.5; }
    .centroid { fill: #dc2626; }
    .origin { fill: #16a34a; }
    .offset-arrow { stroke: #7c3aed; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#7c3aed"/>
    </marker>
    <marker id="axarr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#111">
    scaleModel() 后为什么还要调用 centerModelToOrigin()
  </text>

  <!-- Panel 1 -->
  <g transform="translate(10, 60)">
    <text x="155" y="20" text-anchor="middle" class="panel-title">① loadGLTF() 加载完成</text>
    <line x1="30" y1="320" x2="300" y2="320" class="axis-line" marker-end="url(#axarr)"/>
    <line x1="30" y1="320" x2="30" y2="50" class="axis-line" marker-end="url(#axarr)"/>
    <text x="305" y="324" class="axis-label">X</text>
    <text x="22" y="48" class="axis-label">Y</text>
    <circle cx="30" cy="320" r="4" class="origin"/>
    <text x="36" y="338" class="coord-label">世界原点</text>

    <rect x="130" y="120" width="140" height="140" class="model-box"/>
    <circle cx="200" cy="190" r="4" class="centroid"/>
    <text x="208" y="186" class="coord-label">模型中心</text>
    <text x="208" y="200" class="coord-label" fill="#991b1b">(100, 80)</text>
    <path d="M 30 320 L 198 192" class="offset-arrow" marker-end="url(#arr)"/>

    <text x="30" y="370" class="explanation">GLTF 几何体的中心</text>
    <text x="30" y="388" class="explanation">往往偏离本地原点</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(330, 60)">
    <text x="155" y="20" text-anchor="middle" class="panel-title">② scaleModel(model, 4) 之后</text>
    <line x1="30" y1="320" x2="300" y2="320" class="axis-line" marker-end="url(#axarr)"/>
    <line x1="30" y1="320" x2="30" y2="50" class="axis-line" marker-end="url(#axarr)"/>
    <text x="305" y="324" class="axis-label">X</text>
    <text x="22" y="48" class="axis-label">Y</text>
    <circle cx="30" cy="320" r="4" class="origin"/>

    <rect x="58" y="264" width="56" height="56" class="model-box"/>
    <circle cx="86" cy="292" r="4" class="centroid"/>
    <text x="94" y="288" class="coord-label">模型中心</text>
    <text x="94" y="302" class="coord-label" fill="#991b1b">(40, 32)</text>
    <path d="M 30 320 L 84 294" class="offset-arrow" marker-end="url(#arr)"/>

    <text x="30" y="370" class="explanation">盒子尺寸按比例缩小,</text>
    <text x="30" y="388" class="explanation">"中心到原点的偏移"</text>
    <text x="30" y="406" class="explanation">也按同一比例缩小 → 仍不在原点</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(650, 60)">
    <text x="155" y="20" text-anchor="middle" class="panel-title">③ centerModelToOrigin() 之后</text>
    <line x1="30" y1="250" x2="300" y2="250" class="axis-line" marker-end="url(#axarr)"/>
    <line x1="165" y1="350" x2="165" y2="60" class="axis-line" marker-end="url(#axarr)"/>
    <text x="305" y="254" class="axis-label">X</text>
    <text x="157" y="58" class="axis-label">Y</text>

    <rect x="137" y="222" width="56" height="56" class="model-box"/>
    <circle cx="165" cy="250" r="5" class="origin"/>
    <circle cx="165" cy="250" r="2.5" class="centroid"/>
    <text x="175" y="266" class="coord-label">模型中心</text>
    <text x="175" y="280" class="coord-label" fill="#166534">= 世界原点</text>

    <text x="30" y="370" class="explanation">model.position 减去包围盒</text>
    <text x="30" y="388" class="explanation">中心向量,把模型整体拉回原点</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(0, 460)">
    <rect x="30" y="0" width="900" height="40" fill="#f3f4f6" rx="4"/>
    <text x="480" y="25" text-anchor="middle" font-size="13" fill="#111">
      <tspan font-weight="700">关键:</tspan>
      scale 会把"中心到本地原点的偏移"一并缩放 → 必须
      <tspan font-weight="700" fill="#ea580c">先缩放</tspan>,再
      <tspan font-weight="700" fill="#16a34a">居中</tspan>;顺序反了,缩放会把已经对齐的模型再次推偏
    </text>
  </g>
</svg>
